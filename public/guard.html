<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gate Security Desk | SocietyHub Guard</title>
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="apple-touch-icon" href="images/favicon.png">
  <meta name="description" content="Security guard gate control center for visitor registration, vehicle tracking, deliveries and emergency SOS alerts.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="js/theme.js"></script>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link href="css/style.css" rel="stylesheet">
  <link href="css/sidebar.css" rel="stylesheet">
  <link href="css/reactbits-theme.css" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0e0e12">

  <style>
    body, html, *, .hub-card, .btn, .table, .form-control, .form-select, .badge, .modal, .leonex-sidebar {
      font-family: 'Comfortaa', 'Plus Jakarta Sans', sans-serif !important;
    }

    :root {
      --sa-gold: #F59E0B;
      --sa-dark-card: #141418;
      --sa-dark-border: rgba(255, 255, 255, 0.08);
    }

    [data-theme="dark"] body {
      background: #0e0e12 !important;
      color: #F1F5F9;
    }

    [data-theme="light"] body {
      background: #F8FAFC !important;
      color: #0F172A;
    }

    [data-theme="light"] .hub-card {
      background: #FFFFFF !important;
      border: 1px solid #E2E8F0 !important;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04) !important;
      color: #0F172A !important;
    }

    [data-theme="light"] .form-control,
    [data-theme="light"] .form-select {
      background: #FFFFFF !important;
      border: 1px solid #CBD5E1 !important;
      color: #0F172A !important;
    }

    /* Zero-glow clean sidebar override */
    [data-theme="dark"] .leonex-sidebar {
      background-color: #141418 !important;
      background: #141418 !important;
      box-shadow: none !important;
      border-right: 1px solid rgba(255, 255, 255, 0.08) !important;
    }
    [data-theme="light"] .leonex-sidebar {
      background-color: #FFFFFF !important;
      background: #FFFFFF !important;
      border-right: 1px solid #E2E8F0 !important;
    }

    .guard-pane {
      display: none;
    }
    .guard-pane.show.active {
      display: block;
    }
    .guard-nav-btn {
      color: #94A3B8;
      font-weight: 600;
      font-size: 13.5px;
      padding: 10px 18px;
      border: none;
      border-bottom: 2.5px solid transparent;
      background: transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .guard-nav-btn:hover {
      color: #F8FAFC;
    }
    .guard-nav-btn.active {
      color: #F59E0B !important;
      border-bottom-color: #F59E0B !important;
    }
    .hub-card {
      background: #141418 !important;
      border: 1px solid rgba(255, 255, 255, 0.08) !important;
      border-radius: 16px !important;
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1) !important;
    }
    .hub-card:hover {
      background: #141418 !important;
      border-color: #3b82f6 !important;
      box-shadow: 0 0 0 1px rgba(59, 130, 246, 0.38), 0 8px 30px rgba(0, 0, 0, 0.55), 0 0 18px rgba(59, 130, 246, 0.25) !important;
      transform: translateY(-2px);
    }
    .btn-gold {
      background: linear-gradient(135deg, #F59E0B, #B45309);
      color: #fff !important;
      border: none;
      font-weight: 600;
    }
    .form-control, .form-select {
      background: #17171e !important;
      border: 1px solid rgba(255,255,255,0.08) !important;
      color: #fff !important;
      border-radius: 10px;
    }
    .form-control:focus, .form-select:focus {
      border-color: #F59E0B !important;
      box-shadow: 0 0 0 3px rgba(245,158,11,0.2) !important;
    }
  </style>
</head>
<body>

  <!-- Offline Banner -->
  <div class="offb" id="offlineBanner" style="display:none;"><i class="fa-solid fa-wifi"></i> Offline &mdash; Actions will sync when connection returns.</div>

  <!-- ═══════════════ Main Application Layout ═══════════════ -->
  <div class="leonex-layout" id="mainAppLayout">
    <!-- Fixed Left Sidebar (Controlled via sidebar.js — Zero-Glow Clean Styling) -->
    <aside class="leonex-sidebar" id="leonexSidebar"></aside>

    <!-- Main Viewport Area -->
    <div class="leonex-main-wrapper">

      <!-- ═══════════════ Top Navbar (Matching hero.png & admin-dark.png) ═══════════════ -->
      <nav class="navbar navbar-expand-lg navbar-custom navbar-dashboard">
        <div class="container-fluid px-4">
          <div class="d-flex align-items-center gap-2">
            <button class="leonex-mobile-toggle me-2" aria-label="Open Navigation">
              <i class="fa-solid fa-bars"></i>
            </button>
            <span class="badge rounded-pill px-3 py-2 fs-8 fw-bold d-inline-flex align-items-center gap-1 shadow-sm" style="background: rgba(245,158,11,0.15); color: #F59E0B; border: 1px solid rgba(245,158,11,0.3);">
              <i class="fa-solid fa-shield-halved"></i> Gate Control Desk
            </span>
            <span id="guardModeBadge"></span>
          </div>

          <div class="d-flex align-items-center gap-3">
            <button class="btn-nav-icon position-relative border-0 bg-transparent text-secondary" title="Notifications" onclick="toggleNotificationPanel(this)" aria-label="Notifications">
              <svg class="animate-bell-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path class="animate-bell-clapper" d="M10.268 21a2 2 0 0 0 3.464 0" />
                <path class="animate-bell-body" d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326" />
              </svg>
              <span class="notif-dot"></span>
            </button>

            <button class="btn-theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme" title="Switch Theme">
              <i class="fa-solid fa-moon" id="themeIcon"></i>
            </button>
          </div>
        </div>
      </nav>

      <!-- Main Container -->
      <div class="container-fluid px-3 px-lg-4 py-4">
    <!-- Page Header Hook -->
    <div id="guardPageHeader" class="mb-4"></div>

    <!-- Live KPI Row Hook -->
    <div class="row g-3 mb-4" id="kpiRow"></div>

    <!-- Guard Tabs Bar -->
    <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-4 border-bottom pb-2" style="border-color: rgba(255,255,255,0.08) !important;">
      <div class="d-flex flex-nowrap overflow-x-auto gap-1">
        <button class="guard-nav-btn active" data-guard-tab="entry">
          <i class="fa-solid fa-pen-to-square"></i> Entry Desk
        </button>
        <button class="guard-nav-btn" data-guard-tab="pending">
          <i class="fa-solid fa-clock"></i> Pending Approvals
          <span class="badge rounded-pill bg-warning text-dark fs-9 ms-1" id="pendingBadge" style="display:none;">0</span>
        </button>
        <button class="guard-nav-btn" data-guard-tab="inside">
          <i class="fa-solid fa-building-circle-check"></i> Inside Society
          <span class="badge rounded-pill bg-success fs-9 ms-1" id="insideBadge" style="display:none;">0</span>
        </button>
        <button class="guard-nav-btn" data-guard-tab="deliveries">
          <i class="fa-solid fa-box-open"></i> Deliveries
          <span class="badge rounded-pill bg-info text-dark fs-9 ms-1" id="deliveryBadge" style="display:none;">0</span>
        </button>
        <button class="guard-nav-btn" data-guard-tab="history">
          <i class="fa-solid fa-clock-rotate-left"></i> Visitor Log & History
        </button>
        <button class="guard-nav-btn text-danger" data-guard-tab="emergency">
          <i class="fa-solid fa-triangle-exclamation"></i> Emergency SOS
          <span class="badge rounded-pill bg-danger fs-9 ms-1" id="emergencyBadge" style="display:none;">0</span>
        </button>
      </div>

      <button class="btn btn-outline-warning btn-sm rounded-pill px-3" onclick="location.reload()">
        <i class="fa-solid fa-rotate me-1"></i> Refresh Desk
      </button>
    </div>

    <!-- Guard Content Panes -->
    <!-- 1. Entry Desk -->
    <div class="guard-pane show active" id="tab-guard-entry">
      <div class="row g-4">
        <!-- Left: Quick Entry Form -->
        <div class="col-lg-7">
          <div class="hub-card p-4">
            <h5 class="fw-bold mb-3 text-warning"><i class="fa-solid fa-id-card-clip me-2"></i>New Visitor Check-In</h5>

            <!-- Fast Code / Phone Lookup Box -->
            <div class="p-3 rounded-3 mb-4" style="background: rgba(245,158,11,0.08); border: 1px dashed rgba(245,158,11,0.3);">
              <label class="form-label fs-8 fw-semibold text-warning mb-1">Fast Entry: Enter Passcode or Phone Number</label>
              <div class="input-group">
                <input type="text" class="form-control" id="fastSearchInput" placeholder="e.g. 6-digit passcode or 10-digit mobile">
                <button class="btn btn-gold px-3" type="button" id="fastSearchBtn"><i class="fa-solid fa-magnifying-glass me-1"></i> Check</button>
              </div>
              <div id="fastResultHost" class="mt-2"></div>
            </div>

            <!-- Full Registration Form -->
            <form id="guardEntryForm">
              <div class="row g-2 mb-3">
                <div class="col-md-6">
                  <label class="form-label text-secondary fs-8 fw-semibold">Visitor Full Name *</label>
                  <input type="text" class="form-control" id="gVisitorName" placeholder="e.g. Rahul Sharma" required>
                </div>
                <div class="col-md-6">
                  <label class="form-label text-secondary fs-8 fw-semibold">Mobile Number *</label>
                  <input type="tel" class="form-control" id="gVisitorPhone" placeholder="9876543210" required>
                </div>
              </div>

              <div class="row g-2 mb-3">
                <div class="col-md-4">
                  <label class="form-label text-secondary fs-8 fw-semibold">Target Flat No. *</label>
                  <input type="text" class="form-control" id="gVisitorFlat" placeholder="e.g. A-402" required>
                </div>
                <div class="col-md-4">
                  <label class="form-label text-secondary fs-8 fw-semibold">Visitor Category</label>
                  <select class="form-select" id="gVisitorType">
                    <option value="Guest">Guest</option>
                    <option value="Delivery">Delivery Executive</option>
                    <option value="Cab">Cab / Driver</option>
                    <option value="Service Provider">Service Provider</option>
                    <option value="Staff">Domestic Staff</option>
                    <option value="Other">Other</option>
                  </select>
                </div>
                <div class="col-md-4">
                  <label class="form-label text-secondary fs-8 fw-semibold">Vehicle Number</label>
                  <input type="text" class="form-control" id="gVisitorVehicle" placeholder="e.g. MH 02 AB 1234">
                </div>
              </div>

              <div class="row g-2 mb-3">
                <div class="col-md-6">
                  <label class="form-label text-secondary fs-8 fw-semibold">Host / Flat Owner Name</label>
                  <input type="text" class="form-control" id="gVisitorHost" placeholder="e.g. Amit Patel">
                </div>
                <div class="col-md-6">
                  <label class="form-label text-secondary fs-8 fw-semibold">Purpose of Visit</label>
                  <input type="text" class="form-control" id="gVisitorPurpose" placeholder="e.g. Personal Visit / Package">
                </div>
              </div>

              <!-- Camera Photo Host Hook -->
              <div id="photoCaptureHost" class="mb-3"></div>

              <button type="submit" class="btn btn-gold w-100 py-2 rounded-pill fw-bold">
                <i class="fa-solid fa-circle-check me-1"></i> Verify & Check In Visitor
              </button>
            </form>
          </div>
        </div>

        <!-- Right: Pre-Approved Expected Today -->
        <div class="col-lg-5">
          <div class="hub-card p-4 h-100">
            <h5 class="fw-bold mb-3"><i class="fa-solid fa-calendar-day text-warning me-2"></i>Expected Guests Today</h5>
            <div id="expectedTodayList"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- 2. Pending Approvals -->
    <div class="guard-pane" id="tab-guard-pending">
      <div class="hub-card p-4">
        <h5 class="fw-bold mb-3 text-warning"><i class="fa-solid fa-clock me-2"></i>Waiting for Resident Approval</h5>
        <div id="pendingList"></div>
      </div>
    </div>

    <!-- 3. Inside Society -->
    <div class="guard-pane" id="tab-guard-inside">
      <div class="hub-card p-4">
        <h5 class="fw-bold mb-3 text-success"><i class="fa-solid fa-building-circle-check me-2"></i>Currently Inside Society</h5>
        <div id="insideList"></div>
      </div>
    </div>

    <!-- 4. Deliveries -->
    <div class="guard-pane" id="tab-guard-deliveries">
      <div class="hub-card p-4">
        <h5 class="fw-bold mb-3 text-info"><i class="fa-solid fa-box-open me-2"></i>Active Delivery Executives</h5>
        <div id="deliveryList"></div>
      </div>
    </div>

    <!-- 5. History -->
    <div class="guard-pane" id="tab-guard-history">
      <div class="hub-card p-4">
        <div class="d-flex align-items-center justify-content-between mb-3 flex-wrap gap-2">
          <h5 class="fw-bold mb-0"><i class="fa-solid fa-clock-rotate-left text-warning me-2"></i>Complete Gate Visitor Log</h5>
          <div class="d-flex align-items-center gap-2">
            <input type="date" class="form-control form-control-sm text-white border-secondary" id="historyDate" style="width:160px;">
            <button class="btn btn-outline-secondary btn-sm rounded-pill px-3" id="btnExportGateHistory">
              <i class="fa-solid fa-file-csv me-1"></i> Export CSV
            </button>
          </div>
        </div>
        <div id="historyTableHost"></div>
      </div>
    </div>

    <!-- 6. Emergency SOS -->
    <div class="guard-pane" id="tab-guard-emergency">
      <div class="hub-card p-4 border border-danger" style="background: rgba(239,68,68,0.06);">
        <h5 class="fw-bold text-danger mb-3"><i class="fa-solid fa-triangle-exclamation me-2"></i>Gate Emergency Alarms & SOS Alerts</h5>
        <div id="emergencyList"></div>
      </div><!-- /.guard-pane -->
    </div><!-- /.container-fluid -->
  </div><!-- /.leonex-main-wrapper -->
</div><!-- /.leonex-layout -->

  <!-- Modal: Visitor Pass -->
  <div class="modal fade" id="visitorPassModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title fw-bold">Visitor Gate Pass</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4" id="visitorPassBody"></div>
        <div class="modal-footer border-0 pt-0">
          <button type="button" class="btn btn-secondary rounded-pill px-4" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" style="position: fixed; bottom: 24px; right: 24px; z-index: 99999; display: flex; flex-direction: column; gap: 8px;"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/db.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/guard.js"></script>
  <script src="js/sidebar.js"></script>
</body>
</html>
