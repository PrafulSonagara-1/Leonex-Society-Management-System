<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | SocietyHub</title>
  <meta name="description" content="Sign in to SocietyHub — Smart Society Management System.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Instant redirect if demo URL or hash is requested -->
  <script>
    (function () {
      const urlParams = new URLSearchParams(window.location.search);
      const reqRole = urlParams.get('demo') || urlParams.get('role');
      if (window.location.hash === '#demo' || reqRole || urlParams.get('mode') === 'demo') {
        const dest = 'demo.html' + (reqRole ? '?role=' + encodeURIComponent(reqRole) : '');
        window.location.replace(dest);
      }
    })();
  </script>

  <!-- Clerk Browser SDK -->
  <script
    async
    crossorigin="anonymous"
    data-clerk-publishable-key="pk_test_c3VpdGVkLXJvdWdoeS0xNzk4LmNsZXJrLmFjY291bnRzLmRldiQ"
    src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@5/dist/clerk.browser.js"
    type="text/javascript"
  ></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100vh;
      background: #08080f;
      font-family: 'Comfortaa', system-ui, sans-serif;
      color: #FAFAFA;
      overflow-x: hidden;
    }

    /* Dark ambient starfield background */
    .login-bg {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 50% at 50% 20%, rgba(212,149,90,0.15) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 85% 90%, rgba(99,102,241,0.10) 0%, transparent 55%),
        #08080f;
      z-index: 0;
    }
    .login-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 44px 44px;
      pointer-events: none;
    }

    /* === MAIN LAYOUT: EXACT VERTICAL & HORIZONTAL CENTERING === */
    .login-page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      width: 100%;
      box-sizing: border-box;
    }

    /* Brand Header */
    .brand-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .brand-logo {
      width: 54px; height: 54px;
      border-radius: 16px;
      background: linear-gradient(135deg, #D4955A 0%, #8A542D 100%);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 12px;
      box-shadow: 0 0 32px rgba(212,149,90,0.40), 0 8px 24px rgba(0,0,0,0.6);
      text-decoration: none;
    }
    .brand-logo svg { width: 26px; height: 26px; fill: #fff; }
    .brand-name { font-size: 28px; font-weight: 700; color: #FFFFFF; line-height: 1; }
    .brand-name span { color: #D4955A; }
    .brand-tagline { font-size: 11.5px; color: rgba(255,255,255,0.38); letter-spacing: 0.12em; text-transform: uppercase; margin-top: 6px; }

    /* Clerk Wrapper — strictly centered */
    .clerk-wrapper {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
    }
    #clerk-sign-in {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 380px;
    }

    /* Clerk loader placeholder */
    .clerk-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 40px 20px;
      color: rgba(255,255,255,0.45);
      font-size: 13px;
    }
    .clerk-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(212,149,90,0.2);
      border-top-color: #D4955A;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Footer options below login card */
    .login-footer {
      margin-top: 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .demo-callout {
      font-size: 13px;
      color: rgba(255,255,255,0.45);
    }
    .demo-link {
      color: #D4955A;
      text-decoration: none;
      font-weight: 700;
      transition: color 0.2s;
    }
    .demo-link:hover {
      color: #F0B37E;
      text-decoration: underline;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: rgba(255,255,255,0.28);
      text-decoration: none;
      transition: color 0.2s;
    }
    .back-link:hover { color: rgba(255,255,255,0.6); }
    .back-link svg { width: 13px; height: 13px; }
  </style>
</head>
<body>
  <div class="login-bg"></div>

  <div class="login-page">
    <!-- Brand -->
    <div class="brand-header">
      <a href="index.html" class="brand-logo" aria-label="SocietyHub Home">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22" fill="rgba(0,0,0,0.3)" stroke="#fff" stroke-width="0" />
        </svg>
      </a>
      <div class="brand-name">Society<span>Hub</span></div>
      <div class="brand-tagline">Smart Society Management System</div>
    </div>

    <!-- Centered Clerk Auth Card -->
    <div class="clerk-wrapper">
      <div id="clerk-sign-in">
        <div class="clerk-loading" id="clerkLoadingPlaceholder">
          <div class="clerk-spinner"></div>
          <span>Loading secure sign-in...</span>
        </div>
      </div>
    </div>

    <!-- Clean Centered Footer -->
    <div class="login-footer">
      <p class="demo-callout">
        Looking for a product tour? <a href="demo.html" class="demo-link">Explore Live Demo &rarr;</a>
      </p>
      <a href="index.html" class="back-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
        Back to Homepage
      </a>
    </div>
  </div>

  <script>
    (async function () {
      function waitForClerk() {
        return new Promise(resolve => {
          if (window.Clerk) return resolve(window.Clerk);
          let n = 0;
          const t = setInterval(() => {
            n++;
            if (window.Clerk || n > 200) { clearInterval(t); resolve(window.Clerk || null); }
          }, 50);
        });
      }

      const ROLE_URLS = {
        'Admin': 'admin.html',
        'Resident': 'resident.html',
        'Security Guard': 'guard.html',
        'Committee Member': 'committee.html'
      };

      const clerk = await waitForClerk();
      const mountContainer = document.getElementById('clerk-sign-in');

      if (!clerk) {
        if (mountContainer) {
          mountContainer.innerHTML = `
            <div style="background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); border-radius: 12px; padding: 20px; text-align: center; color: #fff;">
              <p style="font-size: 13px; margin-bottom: 12px;">Unable to load Clerk authentication. Please check your internet connection.</p>
              <a href="demo.html" style="color: #D4955A; font-weight: 700; text-decoration: none;">Continue to Demo Mode &rarr;</a>
            </div>
          `;
        }
        return;
      }

      await clerk.load();

      // If user is already signed in on this browser:
      if (clerk.user) {
        const clerkUser = {
          id: clerk.user.id,
          role: clerk.user.publicMetadata?.role || '',
          societyCode: clerk.user.publicMetadata?.societyCode || ''
        };
        if (clerkUser.role && clerkUser.societyCode && ROLE_URLS[clerkUser.role]) {
          window.location.href = ROLE_URLS[clerkUser.role];
        } else {
          window.location.href = 'onboarding.html';
        }
        return;
      }

      // Remove loading placeholder and mount Clerk's sign in UI
      const placeholder = document.getElementById('clerkLoadingPlaceholder');
      if (placeholder) placeholder.remove();

      clerk.mountSignIn(mountContainer);

      // On successful sign-in
      clerk.addListener(({ user }) => {
        if (user) {
          const primaryEmail = user.primaryEmailAddress?.emailAddress
            || user.emailAddresses?.[0]?.emailAddress || '';
          const name = user.fullName || user.firstName || primaryEmail.split('@')[0] || 'Member';

          const clerkUser = {
            id: user.id,
            name,
            email: primaryEmail,
            role: user.publicMetadata?.role || '',
            societyCode: user.publicMetadata?.societyCode || '',
            status: 'Approved',
            phone: user.primaryPhoneNumber?.phoneNumber || '',
            avatar: user.imageUrl || '',
            authProvider: 'clerk'
          };
          sessionStorage.setItem('ssm_clerk_user', JSON.stringify(clerkUser));
          sessionStorage.setItem('ssm_auth_token', user.id);

          if (clerkUser.role && clerkUser.societyCode) {
            sessionStorage.setItem('ssm_current_user', JSON.stringify(clerkUser));
            window.location.href = ROLE_URLS[clerkUser.role] || 'onboarding.html';
          } else {
            window.location.href = 'onboarding.html';
          }
        }
      });
    })();
  </script>
</body>
</html>
